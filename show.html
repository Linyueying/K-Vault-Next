<!doctype html>
<html lang="zh-CN" data-show-style="journal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在 K-Vault Show 浏览精选图片和视频。">
  <meta name="theme-color" content="#f7f3eb">
  <title>Show · K-Vault</title>
  <script>
    (() => {
      const VALID_STYLES = ['journal', 'gallery', 'filmstrip'];
      const THEME_COLORS = { journal: '#f7f3eb', gallery: '#11100e', filmstrip: '#f4f5f2' };
      const preview = new URLSearchParams(location.search).get('preview_style');
      const applyEarlyStyle = (style) => {
        const chosen = VALID_STYLES.includes(preview) ? preview : (VALID_STYLES.includes(style) ? style : 'journal');
        document.documentElement.dataset.showStyle = chosen;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = THEME_COLORS[chosen] || THEME_COLORS.journal;
      };
      if (VALID_STYLES.includes(preview)) applyEarlyStyle(preview);
      window.showStartup = fetch('/api/show', { cache: 'no-store' }).then(async response => {
        if (!response.ok) return null;
        const page = await response.json();
        applyEarlyStyle(page.settings?.style);
        const first = Array.isArray(page.items) ? page.items[0] : null;
        let coverImage = null;
        if (first?.kind === 'image') {
          const image = new Image();
          image.fetchPriority = 'high';
          image.addEventListener('error', () => { image.dataset.failed = 'true'; }, { once: true });
          image.src = first.src;
          coverImage = { id: first.id, image };
        }
        return { page, coverImage };
      }).catch(() => null);
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/show.css">
  <script defer src="/assets/js/app-core.js"></script>
  <script defer src="/assets/js/show.js"></script>
</head>
<body>
  <div class="kv-header-wrap">
        <header class="kv-header" data-kv-header id="show-header">
          <a class="kv-brand" href="/" id="show-home-link">
            <span class="kv-brand__mark"><img src="/assets/img/logo-64.png" alt="K-Vault-Next" onerror="this.onerror=null;this.src='/assets/img/favicon.ico';" /></span>
            <span class="kv-brand__name" data-brand-name>K-Vault-Next</span>
            <span class="kv-brand__tag">SHOW</span>
          </a>
          <span id="show-nav-title" hidden aria-hidden="true">Show<span>.</span></span>
          <nav class="kv-nav" aria-label="主导航">
            <span class="kv-nav__pill" aria-hidden="true"></span>
            <a href="/">首页</a>
            <a href="/upload.html">上传</a>
            <a href="/show" aria-current="page">Show</a>
            <a href="/vault.html">密码库</a>
            <a href="/webdav.html">接入</a>
            <a href="/admin/files">后台</a>
          </nav>
          <div class="kv-actions">
            <div class="share-tools" id="share-tools">
              <button class="kv-pill-btn" id="share-page" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 15V3m-4 4 4-4 4 4M7 11H5v9h14v-9h-2"/>
                </svg>
                <span>分享 Show</span>
              </button>
              <span id="share-status" class="share-status" role="status"></span>
            </div>
            <button class="kv-nav-toggle" type="button" data-kv-nav-toggle aria-label="展开导航菜单" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
            </button>
          </div>
        </header>
      </div>

  <main class="wrap">
    <div class="cover" id="show-cover">
      <div id="show-cover-copy" class="cover__copy">
        <p class="cover__tag" id="show-eyebrow">影像手记</p>
        <div class="cover__wordmark" id="show-title-anchor">
          <h1 id="show-wordmark">Show<span aria-hidden="true">.</span></h1>
        </div>
        <p class="cover__intro" id="show-intro">用照片和视频记录值得分享的片刻。</p>
        <dl class="cover__meta" id="show-cover-meta" aria-label="展厅统计">
          <div class="cover__stat">
            <dt>WORKS</dt>
            <dd id="show-stat-works">00</dd>
          </div>
          <div class="cover__stat">
            <dt>SERIES</dt>
            <dd id="show-stat-groups">00</dd>
          </div>
        </dl>
      </div>
      <div class="cover__work" id="cover-work"></div>
    </div>

    <nav class="show-filter" id="show-filter-bar" aria-label="按标签筛选作品" hidden></nav>

    <section class="journal" aria-labelledby="journal-title" id="journal" hidden>
      <div class="journal__header">
        <h2 id="journal-title">影像集</h2>
      </div>
      <div class="journal__grid" id="journal-grid"></div>
    </section>

    <div class="show-status">
      <p id="gallery-status" role="status">正在加载作品…</p>
      <button id="more-work" class="pill" type="button" hidden>查看更多</button>
      <noscript><p>开启 JavaScript 后即可浏览作品。</p></noscript>
    </div>
  </main>

  <footer class="kv-footer">
        <div class="kv-footer__meta">
          <span class="kv-footer__brand">
            <img src="/assets/img/logo-64.png" alt="K-Vault-Next" onerror="this.onerror=null;this.src='/assets/img/favicon.ico';" />
            <span data-brand-name>K-Vault-Next</span>
          </span>
          <span class="kv-footer__dot" aria-hidden="true">·</span>
          <a class="kv-footer__license" href="https://github.com/Linyueying/K-Vault-Next/blob/HEAD/LICENSE" target="_blank" rel="noopener noreferrer">© 2026 Linyueying · AGPL-3.0 开源协议</a>
          <span class="kv-footer__dot" aria-hidden="true">·</span>
          <span id="show-footer-style"></span>
        </div>
        <nav class="kv-footer__links" aria-label="页脚导航">
          <a href="https://github.com/Linyueying/K-Vault-Next" target="_blank" rel="noopener noreferrer">
            <svg class="kv-footer__gh-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
            <span>GitHub</span>
          </a>
          <a href="/promo.html">宣传页</a>
          <a href="/show">Show</a>
          <a href="/vault.html">密码库</a>
          <a href="/webdav.html">WebDAV / MCP</a>
          <a href="/admin/files">管理后台</a>
        </nav>
      </footer>

  <template id="stack-template">
    <article class="photo-stack">
      <div class="stack__heading">
        <h3></h3>
      </div>
      <div class="stack__pile" role="group" aria-roledescription="照片叠" aria-keyshortcuts="ArrowLeft ArrowRight"></div>
      <div class="stack__details">
        <div class="stack__text" aria-live="polite" aria-atomic="true">
          <strong class="stack__title"></strong>
          <p class="stack__caption" hidden></p>
        </div>
        <div class="stack__controls" hidden>
          <button class="stack__arrow" type="button" data-step="-1" aria-label="上一张">‹</button>
          <span class="stack__count"></span>
          <button class="stack__arrow" type="button" data-step="1" aria-label="下一张">›</button>
        </div>
      </div>
    </article>
  </template>

  <dialog class="show-lightbox" aria-labelledby="lightbox-title" id="show-lightbox">
    <div class="lightbox__stage">
      <div class="lightbox__bar">
        <span class="lightbox__count"></span>
        <div class="lightbox__bar-actions">
          <a class="lightbox__button lightbox__download" id="lightbox-download" aria-label="下载原文件" title="下载原文件" download hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/>
            </svg>
          </a>
          <button class="lightbox__button" type="button" aria-label="关闭放大预览" data-close autofocus>×</button>
        </div>
      </div>
      <div class="lightbox__media-wrap">
        <div class="lightbox__media"></div>
      </div>
      <div class="lightbox__footer">
        <div class="lightbox__text" aria-live="polite" aria-atomic="true">
          <h2 id="lightbox-title"></h2>
          <p hidden></p>
        </div>
        <div class="lightbox__controls" hidden>
          <button class="lightbox__button" type="button" data-step="-1" aria-label="上一张">‹</button>
          <button class="lightbox__button" type="button" data-step="1" aria-label="下一张">›</button>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
