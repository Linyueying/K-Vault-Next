<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>白名单模式已开启 | K-Vault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js?v=20260305"></script>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
<style>
  /* ===== 与 index.html 统一的设计令牌 ===== */
  :root {
    --primary: #0284c7;
    --primary-rgb: 2, 132, 199;
    --primary-light: #38bdf8;
    --primary-dark: #0369a1;
    --primary-surface: #e0f2fe;

    --bg-body: #f0f7ff;
    --bg-gradient: radial-gradient(at 8% 8%, #e0f2fe 0px, transparent 45%),
                   radial-gradient(at 92% 92%, #bae6fd 0px, transparent 48%),
                   #f0f7ff;

    --glass-surface: rgba(255, 255, 255, 0.84);
    --glass-elevated: rgba(255, 255, 255, 0.95);
    --glass-subtle: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.95);
    --glass-border-ice: rgba(186, 230, 253, 0.75);
    --glass-specular: rgba(255, 255, 255, 0.95);

    --text-main: #0f172a;
    --text-sub: #334155;
    --text-muted: #64748b;

    --shadow-soft: 0 8px 24px -4px rgba(2, 132, 199, 0.08), 0 2px 8px -2px rgba(0, 0, 0, 0.03);
    --shadow-elevated: 0 16px 36px -6px rgba(2, 132, 199, 0.16), 0 4px 12px -2px rgba(0, 0, 0, 0.04);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --radius-pill: 9999px;

    --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
    --transition: all 0.22s var(--ease-fluid);
  }

  html[data-theme="dark"] {
    --primary: #38bdf8;
    --primary-rgb: 56, 189, 248;
    --primary-light: #7dd3fc;
    --primary-dark: #0284c7;
    --primary-surface: rgba(2, 132, 199, 0.18);

    --bg-body: #070d19;
    --bg-gradient: radial-gradient(at 10% 10%, rgba(2, 132, 199, 0.18) 0px, transparent 50%),
                   radial-gradient(at 90% 90%, rgba(14, 165, 233, 0.12) 0px, transparent 50%),
                   #070d19;

    --glass-surface: rgba(15, 27, 49, 0.85);
    --glass-elevated: rgba(20, 36, 66, 0.95);
    --glass-subtle: rgba(15, 27, 49, 0.6);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-border-ice: rgba(56, 189, 248, 0.25);
    --glass-specular: rgba(255, 255, 255, 0.2);

    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
    --text-muted: #94a3b8;

    --shadow-soft: 0 10px 30px -6px rgba(0, 0, 0, 0.55);
    --shadow-elevated: 0 18px 45px -6px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    /* theme.css 对 body 有 background !important，此处需同等级声明覆盖 */
    background: var(--bg-gradient) !important;
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: var(--glass-surface);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    max-width: 500px;
    text-align: center;
    box-shadow: var(--shadow-soft), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    border: 1px solid var(--glass-border);
    animation: fadeIn 0.5s ease-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #e6a23c, #f0b86e);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 2.5em;
    color: white;
    box-shadow: 0 8px 24px rgba(230, 162, 60, 0.3);
  }
  
  .title {
    font-size: 1.5em;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 16px;
  }
  
  .message {
    color: var(--text-sub);
    line-height: 1.8;
    margin-bottom: 24px;
    font-size: 0.95em;
  }
  
  .message-en {
    color: var(--text-muted);
    font-size: 0.85em;
    margin-bottom: 32px;
  }
  
  .footer {
    color: var(--text-muted);
    font-size: 0.85em;
  }
  
  .footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s;
  }
  
  .footer a:hover {
    text-decoration: underline;
  }
  
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 0.95em;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    margin-bottom: 24px;
  }
  
  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
  }
</style>
<link rel="stylesheet" href="/mobile-refactor.css">
</head>
<body>
  <div class="container">
    <div class="icon">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h1 class="title">白名单模式已开启</h1>
    <p class="message">
      当前已开启白名单模式，上传的文件需要审核通过后才能展示。请等待管理员审核通过后再访问。
    </p>
    <p class="message-en">
      Whitelist mode is enabled. Uploaded files need approval before display.
    </p>
    <a href="javascript:history.back()" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      返回上一页
    </a>
    <p class="footer">
      Powered by <a href="https://github.com/katelya77/K-Vault">K-Vault</a>
    </p>
  </div>
</body>
</html>
