<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>概览 · K-Vault-NEXT</title>
    <meta name="description" content="K-Vault-NEXT 工作台：文件、存储与 WebDAV / MCP 接入状态。" />
    <meta name="theme-color" content="#f0f7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070d19" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="概览 · K-Vault-NEXT" />
    <meta property="og:description" content="文件、存储与 WebDAV / MCP 接入状态。" />
    <meta property="og:image" content="/assets/img/logo-180.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/img/logo-180.png">
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/assets/vendor/glassfx/glass.css" />
    <link rel="stylesheet" href="/assets/css/design-system.css" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <script src="/assets/js/theme.js"></script>
    <script defer src="/assets/js/app-core.js"></script>
    <style>
      body {
        background: var(--bg-gradient);
        background-attachment: scroll;
        color: var(--text-main);
        font-family: var(--font-sans);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .dash-shell {
        position: relative;
        z-index: 2;
        max-width: 1080px;
        margin: 0 auto;
        padding: 18px var(--sp-5) 44px;
      }

      .dash-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-4);
        padding: 6px 0;
        animation: riseInSm 0.44s var(--ease-fluid) backwards;
      }
      .dash-brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; color: inherit; text-decoration: none; }
      .dash-brand__logo {
        width: 38px; height: 38px; flex: none;
        display: flex; align-items: center; justify-content: center;
        border-radius: var(--r-sm);
        background: linear-gradient(135deg, #fff, #e0f2fe);
        border: 1px solid var(--glass-border-ice);
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.14);
      }
      .dash-brand__logo img { width: 24px; height: 24px; object-fit: contain; }
      .dash-brand__text { display: flex; flex-direction: column; min-width: 0; }
      .dash-brand__text strong { font-size: var(--fs-lg); font-weight: 800; letter-spacing: -0.02em; }
      .dash-brand__text span { color: var(--text-muted); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; }
      .dash-nav { display: flex; align-items: center; gap: 2px; }
      .dash-nav a {
        padding: 7px 11px;
        border-radius: var(--r-pill);
        color: var(--text-sub);
        font-size: var(--fs-sm);
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: var(--transition);
      }
      .dash-nav a:hover { color: var(--primary-dark); background: rgba(var(--primary-rgb), 0.07); }
      .dash-nav a.is-current { color: var(--primary-dark); background: var(--glass-surface); }
      html[data-theme="dark"] .dash-nav a:hover,
      html[data-theme="dark"] .dash-nav a.is-current { color: var(--primary-light); }
      .dash-theme {
        width: var(--h-ctrl-sm); height: var(--h-ctrl-sm);
        margin-left: 2px;
        border: 1px solid transparent; border-radius: var(--r-pill);
        background: transparent; color: var(--text-muted);
        cursor: pointer; transition: var(--transition);
      }
      .dash-theme:hover { color: var(--primary); border-color: var(--glass-border-ice); background: var(--glass-surface); }

      .dash-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--sp-4);
        flex-wrap: wrap;
        padding: 34px 0 18px;
        animation: riseIn 0.5s var(--ease-fluid) 0.04s backwards;
      }
      .dash-head h1 {
        font-size: clamp(1.9rem, 3.6vw, 2.4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        font-weight: 800;
        background: linear-gradient(135deg, var(--text-main) 30%, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .dash-head p { margin-top: 6px; color: var(--text-muted); font-size: var(--fs-md); }
      .dash-actions { display: flex; align-items: center; gap: 8px; }
      .dash-actions .ui-btn { flex: none; width: auto; height: 42px; padding: 0 16px; }
      .dash-refresh {
        width: 42px; height: 42px;
        display: inline-flex; align-items: center; justify-content: center;
        border: 1px solid var(--glass-border-ice);
        border-radius: 50%;
        background: var(--glass-surface);
        color: var(--text-muted);
        cursor: pointer;
        transition: var(--transition);
      }
      .dash-refresh:hover { color: var(--primary); border-color: rgba(var(--primary-rgb), 0.4); }
      .dash-refresh.is-loading i { opacity: 0.45; }

      .dash-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .dash-metric {
        padding: 15px 18px 14px;
        border: 1px solid var(--glass-border-ice);
        border-radius: var(--r-md);
        background: var(--glass-surface);
        box-shadow: var(--shadow-soft);
      }
      .dash-metric span { display: block; color: var(--text-muted); font-size: var(--fs-xs); font-weight: 600; }
      .dash-metric strong {
        display: block;
        margin-top: 5px;
        color: var(--text-main);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }
      .dash-metric small { display: block; margin-top: 3px; color: var(--text-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dash-metric--files strong { color: var(--primary-dark); }
      html[data-theme="dark"] .dash-metric--files strong { color: var(--primary-light); }

      .dash-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.8fr);
        gap: 16px;
        align-items: start;
      }
      .dash-card__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 4px 8px;
      }
      .dash-card__head h2 { font-size: var(--fs-md); font-weight: 700; color: var(--text-main); }
      .dash-card__head a { color: var(--primary); font-size: var(--fs-xs); font-weight: 600; text-decoration: none; }
      .dash-card__head a:hover { text-decoration: underline; }

      .dash-file { cursor: pointer; }
      .dash-file:hover { background: rgba(var(--primary-rgb), 0.04); }
      .dash-file .ui-row__icon { overflow: hidden; }
      .dash-file .ui-row__title { font-size: 14px; }
      .dash-file .ui-row__sub { font-size: 11px; }

      .dash-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 30px 18px;
        text-align: center;
      }
      .dash-empty i { color: var(--text-muted); font-size: 22px; opacity: 0.55; }
      .dash-empty p { color: var(--text-muted); font-size: var(--fs-sm); }
      .dash-empty .ui-btn { width: auto; flex: none; height: 38px; padding: 0 16px; margin-top: 4px; font-size: 13px; }

      .dash-skeleton {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
        border-top: 1px solid var(--ui-separator);
      }
      .dash-skeleton:first-child { border-top: 0; }
      .dash-skeleton b {
        width: 30px; height: 30px;
        flex: none;
        border-radius: 7px;
        background: rgba(var(--primary-rgb), 0.08);
      }
      .dash-skeleton span {
        height: 9px;
        flex: 1;
        border-radius: 5px;
        background: rgba(var(--primary-rgb), 0.08);
      }

      .dash-side .ui-section-label { padding-left: 4px; }
      .dash-side .ui-section-label + .ui-group { margin-top: 0; }
      .dash-side .ui-row { min-height: 56px; }
      .dash-side .ui-row__title { font-size: 15px; }
      .dash-side .ui-row__sub { font-size: 11px; }

      .dash-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-3);
        flex-wrap: wrap;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--glass-border-ice);
        color: var(--text-muted);
        font-size: 12px;
      }
      .dash-footer a { color: var(--text-sub); text-decoration: none; }
      .dash-footer a:hover { color: var(--primary); }

      @media (max-width: 860px) {
        .dash-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .dash-shell { padding: 12px var(--sp-3) 32px; }
        .dash-brand { flex: 0 0 auto; }
        .dash-brand__logo { width: 34px; height: 34px; }
        .dash-brand__text strong { font-size: var(--fs-md); max-width: 104px; }
        .dash-nav { gap: 0; }
        .dash-nav a { padding: 6px 7px; font-size: var(--fs-xs); }
        .dash-nav__admin { display: none; }
        .dash-head { padding-top: 28px; align-items: center; }
        .dash-head h1 { font-size: 1.9rem; }
        .dash-head p { font-size: 12px; }
        .dash-actions .ui-btn { height: 38px; padding: 0 13px; font-size: 13px; }
        .dash-refresh { width: 38px; height: 38px; }
        .dash-metrics { gap: 8px; }
        .dash-metric { padding: 12px 13px; }
        .dash-metric strong { font-size: 22px; }
        .dash-metric small { font-size: 10px; }
        .dash-file .ui-row__title { font-size: 13px; }
        .ui-row code.ui-row__value { max-width: 48%; }
      }
      @media (max-width: 380px) {
        .dash-nav a:nth-child(1) { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
    </div>

    <div class="dash-shell">
      <header class="dash-topbar">
        <a class="dash-brand" href="./">
          <span class="dash-brand__logo">
            <img src="/assets/img/logo-64.png" alt="Logo" onerror="this.onerror=null;this.src='/assets/img/favicon.ico';" />
          </span>
          <span class="dash-brand__text">
            <strong data-brand-name>K-Vault-NEXT</strong>
            <span>工作台</span>
          </span>
        </a>
        <nav class="dash-nav" aria-label="主导航">
          <a class="is-current" href="./">概览</a>
          <a href="./upload.html">上传</a>
          <a href="./gallery.html">图床</a>
          <a href="./webdav.html">接入</a>
          <a class="dash-nav__admin" href="/admin/files">后台</a>
          <button class="dash-theme" type="button" data-theme-toggle aria-label="切换主题">
            <i class="fas fa-moon" data-theme-icon></i>
          </button>
        </nav>
      </header>

      <main>
        <div class="dash-head">
          <div>
            <h1>概览</h1>
            <p id="dashSub">正在读取状态…</p>
          </div>
          <div class="dash-actions">
            <button class="dash-refresh" id="refreshBtn" type="button" title="刷新" aria-label="刷新">
              <i class="fas fa-rotate" id="refreshIcon"></i>
            </button>
            <a class="ui-btn" href="./upload.html"><i class="fas fa-cloud-arrow-up"></i>上传文件</a>
          </div>
        </div>

        <section class="dash-metrics" aria-label="概况">
          <div class="dash-metric dash-metric--files">
            <span>文件</span>
            <strong id="statFiles">—</strong>
            <small id="statFilesSub">最近更新</small>
          </div>
          <div class="dash-metric">
            <span>存储后端</span>
            <strong id="statBackends">—</strong>
            <small id="statBackendsSub">已连接</small>
          </div>
          <div class="dash-metric">
            <span>单文件上限</span>
            <strong id="statLimit">—</strong>
            <small id="statLimitSub">上限</small>
          </div>
        </section>

        <div class="dash-grid">
          <section>
            <div class="dash-card__head">
              <h2>最近文件</h2>
              <a href="/admin/files">全部</a>
            </div>
            <div class="ui-group" id="recentList">
              <div class="dash-skeleton"><b></b><span></span></div>
              <div class="dash-skeleton"><b></b><span></span></div>
              <div class="dash-skeleton"><b></b><span></span></div>
            </div>
          </section>

          <aside class="dash-side">
            <div class="ui-section-label">接入</div>
            <div class="ui-group ui-group--icons">
              <a class="ui-row" href="./webdav.html">
                <span class="ui-row__icon"><i class="fas fa-hard-drive"></i></span>
                <span class="ui-row__body">
                  <span class="ui-row__title">WebDAV</span>
                  <span class="ui-row__sub">挂载为网络磁盘</span>
                </span>
                <span class="ui-badge" id="davBadge">检测中</span>
                <i class="fas fa-chevron-right ui-chevron"></i>
              </a>
              <a class="ui-row" href="./webdav.html?tab=mcp">
                <span class="ui-row__icon is-purple"><i class="fas fa-robot"></i></span>
                <span class="ui-row__body">
                  <span class="ui-row__title">MCP</span>
                  <span class="ui-row__sub">让 AI 直接读写</span>
                </span>
                <span class="ui-badge" id="mcpBadge">检测中</span>
                <i class="fas fa-chevron-right ui-chevron"></i>
              </a>
              <a class="ui-row" href="/admin/storage">
                <span class="ui-row__icon is-green"><i class="fas fa-database"></i></span>
                <span class="ui-row__body">
                  <span class="ui-row__title">存储</span>
                  <span class="ui-row__sub" id="storageSub">读取中…</span>
                </span>
                <i class="fas fa-chevron-right ui-chevron"></i>
              </a>
            </div>
          </aside>
        </div>
      </main>

      <footer class="dash-footer">
        <span>K-Vault-NEXT</span>
        <span><a href="./upload.html">上传</a> · <a href="./gallery.html">图床</a> · <a href="./webdav.html">接入</a> · <a href="/admin/files">后台</a></span>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEYS = ["telegram", "r2", "s3", "discord", "huggingface", "webdav", "github"];
        var STORAGE_LABELS = {
          telegram: "Telegram",
          r2: "Cloudflare R2",
          s3: "S3",
          discord: "Discord",
          huggingface: "HuggingFace",
          webdav: "WebDAV",
          github: "GitHub"
        };
        var ICONS = {
          image: "fas fa-image",
          video: "fas fa-video",
          audio: "fas fa-music",
          document: "fas fa-file-lines"
        };

        var dashSub = document.getElementById("dashSub");
        var statFiles = document.getElementById("statFiles");
        var statFilesSub = document.getElementById("statFilesSub");
        var statBackends = document.getElementById("statBackends");
        var statBackendsSub = document.getElementById("statBackendsSub");
        var statLimit = document.getElementById("statLimit");
        var statLimitSub = document.getElementById("statLimitSub");
        var storageSub = document.getElementById("storageSub");
        var recentList = document.getElementById("recentList");
        var refreshBtn = document.getElementById("refreshBtn");
        var refreshIcon = document.getElementById("refreshIcon");
        var davBadge = document.getElementById("davBadge");
        var mcpBadge = document.getElementById("mcpBadge");
        var loggedIn = false;
        var enabledBackends = [];

        function esc(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        function formatSize(bytes) {
          var n = Number(bytes || 0);
          if (!n) return "—";
          var units = ["B", "KB", "MB", "GB", "TB"];
          var i = 0;
          while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
          return (i === 0 ? Math.round(n) : n.toFixed(n >= 10 ? 0 : 1)) + " " + units[i];
        }

        function relativeTime(value) {
          var raw = Number(value || 0);
          if (!raw) return "—";
          var ms = raw < 1e12 ? raw * 1000 : raw;
          var diff = Math.max(0, Date.now() - ms) / 1000;
          if (diff < 60) return "刚刚";
          if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
          if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
          if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
          var d = new Date(ms);
          return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate();
        }

        function typeOf(name, meta) {
          if (meta && meta.fileType) return meta.fileType;
          var ext = String(name || "").split(".").pop().toLowerCase();
          if (["png", "jpg", "jpeg", "gif", "webp", "svg", "avif", "bmp", "ico"].indexOf(ext) > -1) return "image";
          if (["mp4", "webm", "mov", "mkv", "avi", "m4v"].indexOf(ext) > -1) return "video";
          if (["mp3", "wav", "ogg", "flac", "m4a", "aac"].indexOf(ext) > -1) return "audio";
          return "document";
        }

        function setBadge(el, state, label) {
          if (!el) return;
          el.classList.remove("is-on", "is-off");
          if (state === true) el.classList.add("is-on");
          else if (state === false) el.classList.add("is-off");
          el.textContent = label;
        }

        function renderLogin(message) {
          recentList.innerHTML =
            '<div class="dash-empty">' +
              '<i class="fas fa-lock"></i>' +
              '<p>' + esc(message || "登录后查看最近文件") + '</p>' +
              '<a class="ui-btn" href="./login.html?redirect=%2F">登录</a>' +
            '</div>';
        }

        function renderEmpty() {
          recentList.innerHTML =
            '<div class="dash-empty">' +
              '<i class="fas fa-folder-open"></i>' +
              '<p>还没有文件</p>' +
              '<a class="ui-btn" href="./upload.html">上传第一个</a>' +
            '</div>';
        }

        function renderFiles(files) {
          if (!files.length) { renderEmpty(); return; }
          recentList.innerHTML = files.map(function (item) {
            var meta = item.metadata || {};
            var name = meta.fileName || item.name || "未命名";
            var type = typeOf(name, meta);
            var url = location.origin + "/file/" + item.name;
            var sub = [formatSize(meta.fileSize), STORAGE_LABELS[meta.storageType] || meta.storageType || "Telegram", relativeTime(meta.TimeStamp)]
              .filter(function (x) { return x && x !== "—"; }).join(" · ");
            return '<div class="ui-row dash-file" data-href="' + esc(url) + '" role="link" tabindex="0" title="' + esc(name) + '">' +
              '<span class="ui-row__icon"><i class="' + (ICONS[type] || ICONS.document) + '"></i></span>' +
              '<span class="ui-row__body">' +
                '<span class="ui-row__title">' + esc(name) + '</span>' +
                '<span class="ui-row__sub">' + esc(sub) + '</span>' +
              '</span>' +
              '<button class="ui-copy" type="button" data-copy-url="' + esc(url) + '" aria-label="复制直链"><i class="fas fa-copy"></i></button>' +
            '</div>';
          }).join("");
        }

        function applyStatus(st) {
          loggedIn = !!(st && !(st.auth && st.auth.enabled && st.auth.authenticated === false));
          if (!loggedIn) {
            statFiles.textContent = "—";
            statFilesSub.textContent = "登录后查看";
            statBackends.textContent = "—";
            statBackendsSub.textContent = "登录后查看";
            statLimit.textContent = "—";
            statLimitSub.textContent = "登录后查看";
            storageSub.textContent = "登录后查看";
            dashSub.textContent = "登录后查看文件与容量";
            return;
          }

          enabledBackends = STORAGE_KEYS.filter(function (key) {
            var item = st && st[key];
            return !!(item && (item.enabled || item.configured || item.connected) && item.enabled !== false);
          });
          statBackends.textContent = String(enabledBackends.length);
          statBackendsSub.textContent = "共 " + STORAGE_KEYS.length + " 种";
          storageSub.textContent = enabledBackends.length
            ? enabledBackends.length + " 个后端已连接"
            : "尚未配置后端";

          var max = 0;
          var maxKey = "";
          enabledBackends.forEach(function (key) {
            var limit = st.uploadLimits && st.uploadLimits[key];
            var bytes = Number(limit && limit.maxBytes || 0);
            if (bytes > max) { max = bytes; maxKey = key; }
          });
          statLimit.textContent = max ? formatSize(max) : "—";
          statLimitSub.textContent = max ? (STORAGE_LABELS[maxKey] || maxKey) : "未配置后端";
          dashSub.textContent = enabledBackends.length
            ? enabledBackends.length + " 个存储后端 · 单文件最高 " + (max ? formatSize(max) : "—")
            : "尚未配置存储后端";
        }

        function loadStatus() {
          return fetch("/api/status", { credentials: "include" })
            .then(function (res) {
              if (res.status === 401) return null;
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(function (st) {
              if (!st) {
                loggedIn = false;
                applyStatus(null);
                return null;
              }
              applyStatus(st);
              return st;
            })
            .catch(function () {
              dashSub.textContent = "状态读取失败";
              statBackends.textContent = "—";
              statBackendsSub.textContent = "读取失败";
              return null;
            });
        }

        function loadFiles() {
          var p = new URLSearchParams();
          p.set("_t", Date.now());
          p.set("limit", "6");
          p.set("includeStats", "1");
          return fetch("/api/manage/list?" + p.toString(), { credentials: "include" })
            .then(function (res) {
              if (res.status === 401) { loggedIn = false; renderLogin(); return null; }
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(function (data) {
              if (!data) return;
              var files = Array.isArray(data.keys) ? data.keys : [];
              var total = data.stats && typeof data.stats.total === "number" ? data.stats.total : files.length;
              statFiles.textContent = String(total);
              statFilesSub.textContent = files.length ? "最近更新 " + relativeTime(files[0].metadata && files[0].metadata.TimeStamp) : "还没有文件";
              renderFiles(files);
            })
            .catch(function () {
              statFiles.textContent = "—";
              statFilesSub.textContent = "读取失败";
              recentList.innerHTML =
                '<div class="dash-empty">' +
                  '<i class="fas fa-triangle-exclamation"></i>' +
                  '<p>文件列表读取失败</p>' +
                '</div>';
            });
        }

        function probeDav() {
          return fetch("/dav/", { method: "PROPFIND", headers: { Depth: "0" } })
            .then(function (res) {
              if (res.status === 401 || res.status === 200 || res.status === 207) { setBadge(davBadge, true, "已开启"); return; }
              if (res.status === 404) { setBadge(davBadge, false, "未开启"); return; }
              setBadge(davBadge, null, "未知");
            })
            .catch(function () { setBadge(davBadge, null, "未知"); });
        }

        function probeMcp() {
          return fetch("/mcp", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
            body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "initialize",
              params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "k-vault-home", version: "1.0" } }
            })
          })
            .then(function (res) {
              if (res.status === 200 || res.status === 202) { setBadge(mcpBadge, true, "已开启"); return; }
              if (res.status === 404) { setBadge(mcpBadge, false, "未开启"); return; }
              setBadge(mcpBadge, null, "未知");
            })
            .catch(function () { setBadge(mcpBadge, null, "未知"); });
        }

        function loadAll() {
          refreshBtn.classList.add("is-loading");
          refreshIcon.classList.add("fa-spin");
          dashSub.textContent = "正在读取状态…";
          statFiles.textContent = "—";
          statFilesSub.textContent = "最近更新";
          statBackends.textContent = "—";
          statBackendsSub.textContent = "已连接";
          statLimit.textContent = "—";
          statLimitSub.textContent = "上限";
          storageSub.textContent = "读取中…";

          return Promise.all([loadStatus(), loadFiles(), probeDav(), probeMcp()])
            .catch(function () { /* 各分支已处理 */ })
            .finally(function () {
              refreshBtn.classList.remove("is-loading");
              refreshIcon.classList.remove("fa-spin");
            });
        }

        recentList.addEventListener("click", function (e) {
          var copy = e.target.closest("[data-copy-url]");
          if (copy) {
            e.preventDefault();
            e.stopPropagation();
            var url = copy.getAttribute("data-copy-url");
            var done = function (ok) {
              var old = copy.innerHTML;
              copy.innerHTML = '<i class="fas ' + (ok ? "fa-check" : "fa-copy") + '"></i>';
              copy.classList.toggle("is-done", !!ok);
              setTimeout(function () { copy.innerHTML = old; copy.classList.remove("is-done"); }, 1500);
            };
            if (window.KVault && KVault.copy) KVault.copy(url).then(done);
            else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { done(false); });
            return;
          }
          var row = e.target.closest("[data-href]");
          if (row) window.open(row.getAttribute("data-href"), "_blank", "noopener");
        });

        recentList.addEventListener("keydown", function (e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          var row = e.target.closest("[data-href]");
          if (!row || e.target.closest("[data-copy-url]")) return;
          e.preventDefault();
          window.open(row.getAttribute("data-href"), "_blank", "noopener");
        });

        refreshBtn.addEventListener("click", loadAll);

        fetch("/api/site-branding", { headers: { "Accept": "application/json" } })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            if (!data || !data.siteName) return;
            document.querySelectorAll("[data-brand-name]").forEach(function (el) { el.textContent = data.siteName; });
          })
          .catch(function () {});

        loadAll();
      })();
    </script>
  </body>
</html>
