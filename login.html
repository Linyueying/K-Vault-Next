<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | K-Vault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js?v=20260305"></script>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <style>
    /* ===== 与 index.html 统一的设计令牌 ===== */
    :root {
      --primary: #0284c7;
      --primary-rgb: 2, 132, 199;
      --primary-light: #38bdf8;
      --primary-dark: #0369a1;
      --primary-surface: #e0f2fe;

      --bg-body: #f0f7ff;
      --bg-gradient: radial-gradient(at 8% 8%, #e0f2fe 0px, transparent 45%),
                     radial-gradient(at 92% 92%, #bae6fd 0px, transparent 48%),
                     #f0f7ff;

      --glass-surface: rgba(255, 255, 255, 0.84);
      --glass-elevated: rgba(255, 255, 255, 0.95);
      --glass-subtle: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-border-ice: rgba(186, 230, 253, 0.75);
      --glass-specular: rgba(255, 255, 255, 0.95);

      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;

      --shadow-soft: 0 8px 24px -4px rgba(2, 132, 199, 0.08), 0 2px 8px -2px rgba(0, 0, 0, 0.03);
      --shadow-elevated: 0 16px 36px -6px rgba(2, 132, 199, 0.16), 0 4px 12px -2px rgba(0, 0, 0, 0.04);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-pill: 9999px;

      --ease-fluid: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition: all 0.22s var(--ease-fluid);

      /* 旧变量名别名，保证既有样式引用继续可用 */
      --primary-color: var(--primary);
      --accent-color: var(--primary-surface);
      --card-bg: var(--glass-surface);
      --shadow: var(--shadow-soft);
    }

    html[data-theme="dark"] {
      --primary: #38bdf8;
      --primary-rgb: 56, 189, 248;
      --primary-light: #7dd3fc;
      --primary-dark: #0284c7;
      --primary-surface: rgba(2, 132, 199, 0.18);

      --bg-body: #070d19;
      --bg-gradient: radial-gradient(at 10% 10%, rgba(2, 132, 199, 0.18) 0px, transparent 50%),
                     radial-gradient(at 90% 90%, rgba(14, 165, 233, 0.12) 0px, transparent 50%),
                     #070d19;

      --glass-surface: rgba(15, 27, 49, 0.85);
      --glass-elevated: rgba(20, 36, 66, 0.95);
      --glass-subtle: rgba(15, 27, 49, 0.6);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-ice: rgba(56, 189, 248, 0.25);
      --glass-specular: rgba(255, 255, 255, 0.2);

      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;

      --shadow-soft: 0 10px 30px -6px rgba(0, 0, 0, 0.55);
      --shadow-elevated: 0 18px 45px -6px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* theme.css 对 body 有 background !important，此处需同等级声明覆盖 */
      background: var(--bg-gradient) !important;
      background-attachment: fixed;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    html[data-theme="dark"] body {
      background: var(--bg-gradient) !important;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.5s ease-out;
    }

    .login-card {
      background: var(--glass-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      box-shadow: var(--shadow-soft), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      text-align: center;
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: hidden;
    }

    /* 顶部高光条：与 index 的 .liquid-card 保持一致 */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-specular), transparent);
      opacity: 0.9;
      pointer-events: none;
    }

    .logo {
      font-size: 3.5em;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.9em;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-sub);
      margin-bottom: 36px;
      font-size: 0.95em;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9em;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1em;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1.5px solid var(--glass-border-ice);
      border-radius: var(--radius-md);
      font-size: 1em;
      color: var(--text-main);
      transition: var(--transition);
      background: var(--glass-subtle);
    }

    .form-input.has-toggle {
      padding-right: 56px;
    }

    .form-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-surface);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      z-index: 2;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9em;
      color: var(--text-sub);
    }

    .remember-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.9em;
      display: none;
    }

    .error-message.show {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-text {
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.85em;
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    /* 动画 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .login-card {
        max-width: 100%;
        padding: 40px 28px;
      }

      .logo {
        font-size: 3em;
      }

      .title {
        font-size: 1.8em;
      }

      .subtitle {
        font-size: 0.95em;
      }

      .form-input {
        padding: 14px 18px;
        font-size: 1em;
      }

      .form-input.has-toggle {
        padding-right: 52px;
      }

      .password-toggle {
        right: 9px;
        width: 32px;
        height: 32px;
      }

      .submit-btn {
        padding: 14px;
        font-size: 1em;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        align-items: flex-start;
        padding-top: 10vh;
      }

      .login-card {
        padding: 30px 20px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      }

      .logo {
        font-size: 2.5em;
        margin-bottom: 8px;
      }

      .title {
        font-size: 1.4em;
        margin-bottom: 6px;
      }

      .subtitle {
        font-size: 0.85em;
      }

      .login-form {
        gap: 16px;
        margin-top: 24px;
      }

      .form-group {
        margin-bottom: 0;
      }

      .form-group label {
        font-size: 0.85em;
        margin-bottom: 6px;
      }

      .form-input {
        padding: 12px 14px;
        font-size: 0.95em;
        border-radius: 10px;
      }

      .form-input.has-toggle {
        padding-right: 48px;
      }

      .password-toggle {
        right: 8px;
        width: 30px;
        height: 30px;
        font-size: 0.9em;
      }

      .submit-btn {
        padding: 12px;
        font-size: 0.95em;
        border-radius: 10px;
        margin-top: 4px;
      }

      .links {
        margin-top: 20px;
        flex-direction: column;
        gap: 10px;
      }

      .links a {
        font-size: 0.85em;
      }

      /* Element UI 消息优化 */
      .el-message {
        min-width: auto !important;
        max-width: 90% !important;
        padding: 10px 14px !important;
      }

      .el-message__content {
        font-size: 13px !important;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
        padding-top: 8vh;
      }

      .login-card {
        padding: 24px 16px;
        border-radius: 16px;
      }

      .logo {
        font-size: 2.2em;
      }

      .title {
        font-size: 1.25em;
      }

      .form-input {
        padding: 10px 12px;
        font-size: 0.9em;
      }

      .submit-btn {
        padding: 10px;
        font-size: 0.9em;
      }
    }

    /* 深色模式支持 */
  </style>
  <link rel="stylesheet" href="/mobile-refactor.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <i class="fas fa-cloud-upload-alt"></i>
      </div>
      <h1 class="title">K-Vault</h1>
      <p class="subtitle">请登录以继续使用文件托管服务</p>

      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">用户名或密码错误</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">用户名</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" class="form-input has-toggle" placeholder="请输入密码" required>
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="remember" checked>
            <span>记住登录状态</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>登 录</span>
        </button>
      </form>

      <p class="footer-text">
        Powered by <a href="https://github.com/katelya77/K-Vault" target="_blank">K-Vault</a>
      </p>
    </div>
  </div>

  <script>
    // 页面加载时检查认证状态
    (async function() {
      try {
        const response = await fetch('/api/auth/check');
        const data = await response.json();
        
        if (!data.authRequired) {
          // 不需要认证，直接跳转
          redirectToTarget();
          return;
        }
        
        if (data.authenticated) {
          // 已认证，跳转到目标页面
          redirectToTarget();
        }
      } catch (e) {
        console.error('Auth check failed:', e);
      }
    })();

    function redirectToTarget() {
      const params = new URLSearchParams(window.location.search);
      let redirect = params.get('redirect') || '/';
      
      // 防止重定向到登录页本身，避免无限循环
      if (redirect.includes('login.html') || redirect === '/login') {
        redirect = '/';
      }
      
      // 使用 replace 防止用户回退到登录页
      window.location.replace(redirect);
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.getElementById('passwordToggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorDiv.classList.add('show');
    }

    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div><span>登录中...</span>';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>登 录</span>';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }
      
      setLoading(true);
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // 登录成功，跳转
          redirectToTarget();
        } else {
          showError(data.message || '登录失败');
          setLoading(false);
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('网络错误，请稍后重试');
        setLoading(false);
      }
    }

    // 回车键提交
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
